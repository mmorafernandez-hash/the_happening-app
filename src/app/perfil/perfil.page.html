<ion-content class="fondo">

  <div class="cabecera">
    <h2 class="titulo-perfil">PERFIL</h2>
    <ion-button routerLink="/notificaciones" fill="clear" class="campana">
      <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>

  <div class="usuario">
    <div class="avatar">MM</div>
    <div class="datos">
      <h3>Mario Mora</h3>
      <span>Profesor · Organizador</span>
    </div>
  </div>

  <h4 class="seccion">GESTIONAR EVENTOS</h4>

  <button class="opcion" routerLink="/nuevo-evento">
    <div class="izq">
      <div class="caja-icono morado-fuerte">
        <ion-icon name="add-outline"></ion-icon>
      </div>
      <span>Crear evento</span>
    </div>
    <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
  </button>

  <button class="opcion" routerLink="/pasar-lista">
    <div class="izq">
      <div class="caja-icono verde">
        <ion-icon name="qr-code-outline"></ion-icon>
      </div>
      <span>Pasar lista</span>
    </div>
    <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
  </button>

  <button class="opcion" routerLink="/informes">
    <div class="izq">
      <div class="caja-icono lila">
        <ion-icon name="bar-chart-outline"></ion-icon>
      </div>
      <span>Informes</span>
    </div>
    <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
  </button>

  <h4 class="seccion">MI CUENTA</h4>

  <button class="opcion" routerLink="/tickets">
    <div class="izq">
      <div class="caja-icono lila">
        <ion-icon name="ticket-outline"></ion-icon>
      </div>
      <span>Mis entradas</span>
    </div>
    <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
  </button>

  <button class="opcion">
    <div class="izq">
      <div class="caja-icono lila">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <span>Recordatorios</span>
    </div>
    <span class="pildora-verde">1 día antes</span>
  </button>

  <button class="opcion" (click)="cambiarOscuro()">
    <div class="izq">
      <div class="caja-icono lila">
        <ion-icon name="moon-outline"></ion-icon>
      </div>
      <span>Modo oscuro</span>
    </div>
  </button>

  <button class="opcion salir" routerLink="/eventos">
    <div class="izq">
      <div class="caja-icono rojo">
        <ion-icon name="log-out-outline"></ion-icon>
      </div>
      <span class="texto-rojo">Cerrar sesión</span>
    </div>
  </button>

</ion-content>

<ion-footer>
  <ion-tab-bar slot="bottom" class="menu">
    <ion-tab-button routerLink="/eventos">
      <ion-icon name="home-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/tickets">
      <ion-icon name="ticket-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/calendario">
      <ion-icon name="calendar-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/perfil" class="activa">
      <ion-icon name="person-outline"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
