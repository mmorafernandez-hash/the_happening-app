<ion-content [fullscreen]="true" class="fondo">


  <div class="cabecera">
    <div class="perfil">
      <div class="logo">
        <img src="assets/icon/pasa_logo.png" alt="Logo">
      </div>
      <div class="saludo">
        <span class="hola">HOLA,</span>
        <h2 class="nombre">Mario Mora</h2>
        <span class="rol">Profesor · Organizador</span>
      </div>
    </div>

    <ion-button routerLink="/notificaciones" fill="clear" class="campana">
      <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>


  <div class="buscador">
    <ion-searchbar placeholder="Buscar eventos" class="barra"></ion-searchbar>
    <ion-button class="filtro">
      <ion-icon name="options-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>


  <div class="categorias">
    <ion-chip routerLink="/eventos">TODOS</ion-chip>
    <ion-chip routerLink="/deportes">DEPORTES</ion-chip>
    <ion-chip class="activo">OTROS EVENTOS</ion-chip>
  </div>


  <h3 class="seccion">OTROS EVENTOS</h3>


  <ion-card class="tarjeta" routerLink="/detalle-ciencias">
    <div class="portada">
      <img src="assets/icon/teatro.jpg" alt="Feria de Ciencia" />
      <span class="etiqueta">¡Últimas Plazas!</span>
      <div class="sombra">
        <h4>FERIA DE CIENCIA</h4>
      </div>
    </div>
    <div class="detalles">
      <div class="fecha">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>24 sep - 10:00 - Patio Central</span>
      </div>
      <div class="pie">
        <div class="avatares">
          <span class="circulo amarillo"></span>
          <span class="circulo azul"></span>
          <span class="circulo morado"></span>
          <span class="inscritos">150 inscritos</span>
        </div>
        <a class="enlace">Ver más</a>
      </div>
    </div>
  </ion-card>

  <ion-card class="tarjeta" routerLink="/detalle-cultura">
    <div class="portada">
      <img src="assets/icon/musica.jpg" alt="Festival Cultural" />
      <div class="sombra">
        <h4>FESTIVAL CULTURAL</h4>
      </div>
    </div>
    <div class="detalles">
      <div class="fecha">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>2 oct - 12:00 - Salón de Actos</span>
      </div>
      <div class="pie">
        <div class="avatares">
          <span class="circulo amarillo"></span>
          <span class="circulo azul"></span>
          <span class="circulo morado"></span>
          <span class="inscritos">5000 inscritos</span>
        </div>
        <a class="enlace">Ver más</a>
      </div>
    </div>
  </ion-card>

</ion-content>

<ion-footer>
  <ion-tab-bar slot="bottom" class="menu">
    <ion-tab-button routerLink="/eventos" class="activa">
      <ion-icon name="home-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/tickets">
      <ion-icon name="ticket-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/calendario">
      <ion-icon name="calendar-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/perfil">
      <ion-icon name="person-outline"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
